<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gu Jungun</title>
  <meta name="description" content="Gu Jungun: architecture, renovation and furniture.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip" href="#work">Skip to work</a>
  <div class="wrap">
    <header class="top">
      <a class="name" href="index.html">Gu Jungun</a>
      <nav aria-label="Sections">
        <a href="#work">Work</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main>
      <p class="intro" id="intro"></p>

      <section id="work" aria-label="Work">
        <div id="groups"></div>
      </section>

      <section class="section" id="onsite" aria-labelledby="onsite-heading">
        <h2 id="onsite-heading">On site</h2>
        <p class="text" id="onsite-text" style="margin-bottom:1.5rem"></p>
        <div class="strip" id="onsite-photos"></div>
      </section>

      <section class="section" id="about" aria-labelledby="about-heading">
        <h2 id="about-heading">About</h2>
        <div class="two about">
          <div class="text" id="about-text"></div>
          <div>
            <div class="portrait" id="portrait"></div>
            <dl class="list" id="cv"></dl>
          </div>
        </div>
      </section>

      <section class="section" id="contact" aria-labelledby="contact-heading">
        <h2 id="contact-heading">Contact</h2>
        <p class="text" style="margin-bottom:1rem">For new projects, collaborations or a copy of the full portfolio, write to</p>
        <a class="mail" id="mail" href="#"></a>
        <div class="links" id="links"></div>
      </section>
    </main>

    <footer class="foot"><span id="copyright"></span></footer>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
