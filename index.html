<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gu Jungun, architect</title>
  <meta name="description" content="Portfolio of Gu Jungun, an architect based in Seoul: houses, small public buildings and additions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip" href="#work">Skip to work</a>

  <div class="page">
    <main class="sheet" id="top">

      <section class="hero" aria-label="Introduction">
        <svg class="hero-drawing will-draw" viewBox="0 0 900 540" role="img" aria-label="Line drawing of a site plan">
          <!-- road -->
          <path pathLength="1" class="thin" style="--i:0" d="M20 500 H880"/>
          <path pathLength="1" class="thin" style="--i:0" d="M20 524 H880"/>
          <text x="440" y="516" text-anchor="middle">road</text>
          <!-- neighbouring buildings -->
          <path pathLength="1" class="thin" style="--i:1" d="M20 120 H96 V300 H20"/>
          <path pathLength="1" class="thin" style="--i:1" d="M804 80 H880 M804 80 V380 H880"/>
          <!-- lot boundary -->
          <path pathLength="1" class="thin" style="--i:2" d="M130 40 H770 V470 H130 Z"/>
          <!-- garden wall -->
          <path pathLength="1" class="wall" style="--i:3" d="M230 130 H670 V420 H230 Z"/>
          <!-- house: L-shaped wing (south and west) -->
          <path pathLength="1" class="wall" style="--i:4" d="M230 130 H370 V310 H670 V420"/>
          <path pathLength="1" style="--i:5" d="M370 130 V145 H400 V310 M370 310 V330 H670"/>
          <!-- interior partitions -->
          <path pathLength="1" class="thin" style="--i:6" d="M230 230 H370 M300 230 V310 M470 310 V420 M560 310 V420"/>
          <!-- north wing: bedrooms -->
          <path pathLength="1" class="wall" style="--i:6" d="M480 130 H670 V210 H480 Z"/>
          <path pathLength="1" class="thin" style="--i:7" d="M575 130 V210"/>
          <!-- covered walk (dashed) -->
          <path pathLength="1" class="thin" style="--i:8" stroke-dasharray=".02 .012" d="M400 170 H480 M400 190 H480"/>
          <!-- doors -->
          <path pathLength="1" class="thin" style="--i:8" d="M400 240 a30 30 0 0 1 30 -30"/>
          <path pathLength="1" class="thin" style="--i:8" d="M520 310 a26 26 0 0 0 -26 -26"/>
          <path pathLength="1" class="thin" style="--i:8" d="M230 260 a24 24 0 0 1 24 24"/>
          <!-- courtyard: paving joints -->
          <path pathLength="1" class="thin" style="--i:9" d="M430 230 H640 M430 270 H640 M500 210 V300 M570 210 V300"/>
          <!-- courtyard tree -->
          <path pathLength="1" class="thin" style="--i:10" d="M600 270 m-32 0 a32 32 0 1 0 64 0 a32 32 0 1 0 -64 0"/>
          <path pathLength="1" class="thin" style="--i:10" d="M600 270 m-8 0 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0"/>
          <!-- garden trees -->
          <path pathLength="1" class="thin" style="--i:11" d="M180 400 m-30 0 a30 30 0 1 0 60 0 a30 30 0 1 0 -60 0"/>
          <path pathLength="1" class="thin" style="--i:11" d="M720 70 m-22 0 a22 22 0 1 0 44 0 a22 22 0 1 0 -44 0"/>
          <path pathLength="1" class="thin" style="--i:11" d="M720 440 m-26 0 a26 26 0 1 0 52 0 a26 26 0 1 0 -52 0"/>
          <!-- entrance path from road -->
          <path pathLength="1" class="thin" style="--i:12" d="M300 470 V420 M330 470 V420"/>
          <!-- north arrow -->
          <path pathLength="1" class="north" style="--i:13" d="M830 40 m-22 0 a22 22 0 1 0 44 0 a22 22 0 1 0 -44 0"/>
          <path pathLength="1" class="north" style="--i:13" d="M830 60 V22"/>
          <path class="north-fill" d="M830 16 l6 12 h-12 z"/>
          <text x="830" y="80" text-anchor="middle">N</text>
          <!-- scale bar -->
          <path pathLength="1" class="thin" style="--i:14" d="M130 490 H250 M130 486 V494 M170 486 V494 M210 486 V494 M250 486 V494"/>
          <path class="fill" d="M130 488 H170 V492 H130 Z M210 488 H250 V492 H210 Z"/>
          <text x="130" y="482" text-anchor="middle">0</text>
          <text x="250" y="482" text-anchor="middle">10 m</text>
          
        </svg>
        <div class="hero-text">
          <h1>Gu Jungun</h1>
          <p id="tagline"></p>
        </div>
      </section>

      <section class="section" id="work" aria-labelledby="work-heading">
        <div class="section-head">
          <h2 id="work-heading">Selected work</h2>
          <span class="count" id="work-count"></span>
        </div>
        <table class="index">
          <thead>
            <tr>
              <th scope="col">Sheet</th>
              <th scope="col">Project</th>
              <th scope="col">Location</th>
              <th scope="col">Year</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody id="index-rows"></tbody>
        </table>
        <div class="plates" id="plates"></div>
      </section>

      <section class="section onsite" id="onsite" aria-labelledby="onsite-heading">
        <div class="section-head"><h2 id="onsite-heading">On site</h2></div>
        <div class="text" id="onsite-text"></div>
        <div class="strip" id="onsite-photos"></div>
      </section>

      <section class="section about" id="about" aria-labelledby="about-heading">
        <div>
          <div class="section-head"><h2 id="about-heading">About</h2></div>
          <div class="text" id="about-text"></div>
        </div>
        <dl class="cv" id="cv"></dl>
      </section>

      <section class="section contact" id="contact" aria-labelledby="contact-heading">
        <div class="section-head"><h2 id="contact-heading">Contact</h2></div>
        <p>For new projects, collaborations or a copy of the full portfolio, write to</p>
        <a class="mail" id="mail" href="#"></a>
        <div class="links" id="links"></div>
      </section>

      <footer class="sheet-foot">
        <span id="copyright"></span>
        <span>Drawings by the architect</span>
      </footer>
    </main>

    <aside class="titleblock" aria-label="Title block">
      <div class="tb-cell tb-identity">
        <div class="tb-name"><a href="#top">Gu Jungun</a></div>
        <div class="tb-role">Architect, Seoul</div>
      </div>
      <nav class="tb-cell tb-nav" aria-label="Sections">
        <a href="#work">Work</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
      <div class="tb-spacer"></div>
      <div class="tb-cell">
        <div class="tb-sheet">A-000</div>
        <div class="tb-sheet-title">Index of drawings</div>
      </div>
      <div class="tb-cell tb-meta" id="tb-meta"></div>
    </aside>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
